<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0874c8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Grab Roulette"><title>Snowboard Grab Roulette</title><style>
:root{--navy:#092a50;--blue:#067fe1}*{box-sizing:border-box}body{margin:0;color:var(--navy);font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Arial Rounded MT Bold",system-ui,sans-serif;background:linear-gradient(180deg,#1789e4 0%,#61b7ed 37%,#d2eeff 72%,#f6fbff 100%);min-height:100vh;overflow-x:hidden}body:before{content:"";position:fixed;left:-15%;right:-15%;bottom:0;height:42vh;pointer-events:none;background:linear-gradient(145deg,transparent 35%,#ffffffaa 35.5%,#ffffffaa 48%,transparent 48.5%) left bottom/60% 100% no-repeat,linear-gradient(210deg,transparent 31%,#e9f7ffbb 31.5%,#e9f7ffbb 51%,transparent 51.5%) right bottom/75% 100% no-repeat;opacity:.7}.wrap{position:relative;max-width:1100px;margin:auto;padding:22px 15px 40px}.mast{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.logo{font-size:clamp(29px,6.4vw,61px);line-height:.9;letter-spacing:-1.8px;font-weight:1000;font-style:italic;color:white;text-shadow:4px 5px 0 #06284c,-2px -2px 0 #06284c,2px -2px 0 #06284c,-2px 2px 0 #06284c;transform:rotate(-3deg);padding:8px 3px}.logo b{color:#16c0ff}.mountain{font-size:clamp(25px,4vw,42px);font-weight:1000;color:#06315b;line-height:1;text-align:center}.mountain small{display:block;font-size:12px;letter-spacing:1px}.panel{background:#fffffff0;border:2px solid #fff;border-radius:20px;box-shadow:0 9px 25px #064d8525;padding:14px}.levels{display:flex;gap:7px;flex-wrap:wrap}.levels button{border:0;border-radius:25px;padding:11px 13px;background:#e9eff5;color:#173d61;font-weight:800;cursor:pointer}.levels button.active{background:#0879e5;color:white;box-shadow:0 4px 0 #075ba5}.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:18px;align-items:start}.sidebar{display:flex;flex-direction:column;gap:9px;margin-top:65px}.filter{display:flex;align-items:center;text-align:left;width:100%;border:0;background:#ffffffdd;border-radius:14px;padding:12px;gap:10px;color:#123b60;cursor:pointer;font-weight:800}.filter.active{background:#0578df;color:white}.dot{width:30px;height:30px;flex-shrink:0;border-radius:50%;background:#26b75d;border:4px solid #ffffff90}.filter small{display:block;font-weight:600;opacity:.7}.wheel-area{display:flex;flex-direction:column;align-items:center;min-width:0}.pointer{position:relative;z-index:2;font-size:40px;line-height:1;margin-bottom:-18px;filter:drop-shadow(0 3px 2px #083b6c)}.wheel-shell{position:relative;width:min(100%,650px);aspect-ratio:1;border:9px solid #103a65;border-radius:50%;box-shadow:0 0 0 5px #d9f5ff,0 12px 30px #0c4b8055;background:#fff;overflow:hidden}.wheel-rotor{width:100%;height:100%;transition:transform 4.2s cubic-bezier(.12,.74,.14,1);transform:rotate(0deg)}#wheel-svg{width:100%;height:100%;display:block}.hub{position:absolute;inset:35%;border:7px solid white;border-radius:50%;background:#092a50;color:white;display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column;box-shadow:0 2px 9px #1237;pointer-events:none;transform:rotate(-7deg)}.hub span{font-size:clamp(21px,5vw,43px);font-weight:1000;font-style:italic;line-height:1.04}.hub small{font-size:clamp(17px,3vw,26px)}.result{width:min(100%,690px);background:#fffffff2;border:3px solid white;border-radius:24px;padding:20px 18px;text-align:center;margin-top:22px;box-shadow:0 12px 30px #174a7b35;min-height:143px}.result h2{margin:2px 0 7px;font-size:clamp(25px,5vw,40px);font-style:italic}.result p{font-size:clamp(14px,2.5vw,18px);line-height:1.45;margin:8px auto;max-width:560px}.tag{display:inline-block;border-radius:30px;background:#e8eef7;color:#183c61;padding:6px 15px;font-size:13px;font-weight:900}.actions{display:flex;gap:10px;width:min(100%,690px);margin-top:14px}.action{border:0;border-radius:16px;padding:16px 18px;font-weight:1000;cursor:pointer;font-size:17px;box-shadow:0 5px 0 #0a4c83}.spin{flex:1;background:#087be0;color:white}.done{background:#1caa69;color:white;box-shadow:0 5px 0 #11663e}.action:disabled{opacity:.5;cursor:not-allowed}.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;width:min(100%,690px);margin-top:18px;font-weight:800}.reset{border:0;background:#fff;padding:10px 14px;border-radius:12px;font-weight:800;color:#173d61;cursor:pointer}.note{text-align:center;font-size:12px;color:#244c69;background:#ffffffad;border-radius:12px;padding:11px;margin:20px auto;max-width:760px}.snow{position:fixed;pointer-events:none;inset:0;background-image:radial-gradient(white 1px,transparent 2px);background-size:57px 67px;opacity:.25}@media(max-width:740px){.wrap{padding:15px 10px 35px}.mast{margin-bottom:10px}.layout{display:flex;flex-direction:column;gap:8px}.sidebar{margin:0;width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.filter{flex-direction:column;gap:3px;text-align:center;font-size:10px;padding:8px 3px;min-height:65px}.filter small{font-size:9px}.dot{width:16px;height:16px;border-width:2px}.wheel-area{width:100%}.wheel-shell{width:min(93vw,530px);border-width:6px}.hub{border-width:4px}.panel{padding:9px}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.levels button{font-size:11px;padding:10px 2px}.pointer{font-size:30px;margin-bottom:-12px}.result{margin-top:15px;padding:15px 12px;min-height:120px}.actions{flex-wrap:wrap}.action{font-size:15px;padding:14px 10px}.mountain{font-size:23px}.mountain small{font-size:8px}}@media(prefers-reduced-motion:reduce){.wheel-rotor{transition-duration:.01s}}
</style></head><body><div class="snow"></div><main class="wrap"><div class="mast"><div class="logo">SNOWBOARD<br><b>GRAB</b> ROULETTE</div><div class="mountain">▲▲<small>SNOWBOARD<br>CHALLENGE</small></div></div><div class="panel" style="margin-bottom:12px"><div class="levels" id="levels"></div></div><div class="layout"><aside class="sidebar" id="filters"></aside><section class="wheel-area"><div class="pointer">📍</div><div class="wheel-shell"><div class="wheel-rotor" id="rotor"><svg id="wheel-svg" viewBox="0 0 600 600" aria-label="Glücksrad mit Snowboard Grabs"></svg></div><div class="hub"><small>🏂</small><span>DREH<br>AM RAD</span></div></div><div class="result" id="result"><h2>READY TO GRAB?</h2><p>Wähle einen Schwierigkeitsgrad und dreh am Rad!</p></div><div class="actions"><button class="action spin" id="spin">↻ ROULETTE DREHEN</button><button class="action done" id="done" hidden>✓ Geschafft!</button></div><div class="bottom"><span id="progress">0 von 21 geschafft</span><button class="reset" id="reset">↻ Neustart</button></div></section></div><p class="note">Neue Tricks zuerst im Stand üben. Sprünge nur auf passenden Anlagen, mit ausreichendem Können und Betreuung. Grab-Namen können je nach Stil variieren.</p></main><script>
const grabs=[['Indy','Einfach','Greif mit der hinteren Hand zwischen den Bindungen an die Zehenkante.'],['Mute','Einfach','Greif mit der vorderen Hand zwischen den Bindungen an die Zehenkante.'],['Melon','Einfach','Greif mit der vorderen Hand zwischen den Bindungen an die Fersenkante.'],['Stalefish','Einfach','Greif mit der hinteren Hand zwischen den Bindungen an die Fersenkante.'],['Nose Grab','Einfach','Greif ganz vorne an die Nose deines Boards.'],['Tail Grab','Einfach','Greif ganz hinten an die Tail deines Boards.'],['Method','Mittel','Mach einen Melon Grab und zieh dein Board hinter dich.'],['Japan','Mittel','Greif wie beim Mute und zieh dein Board nach hinten.'],['Seatbelt','Mittel','Greif mit der vorderen Hand über den Körper zur Tail.'],['Crail','Mittel','Greif mit der hinteren Hand vor der vorderen Bindung an die Zehenkante.'],['Chicken Salad','Mittel','Greif mit der hinteren Hand zwischen den Beinen an die Fersenkante.'],['Roast Beef','Mittel','Greif mit der hinteren Hand zwischen den Beinen an die Fersenkante – mit anderer Armführung.'],['Nuclear','Mittel','Greif mit der hinteren Hand an die Nose.'],['Truckdriver','Fortgeschritten','Greif gleichzeitig mit beiden Händen an Nose und Tail.'],['Rocket Air','Fortgeschritten','Streck beide Beine und greif vorne an die Nose.'],['Double Grab','Fortgeschritten','Zeig zwei verschiedene Grabs während eines Sprungs.'],['Indy Tweak','Fortgeschritten','Mach einen Indy und streck dein Board stylish zur Seite.'],['Method Tweak','Fortgeschritten','Zieh deinen Method besonders weit nach hinten.'],['Tailfish','Fortgeschritten','Greif mit der hinteren Hand hinter der hinteren Bindung an die Fersenkante.'],['Nosebone','Fortgeschritten','Mach einen Grab und streck dein vorderes Bein.'],['Tailbone','Fortgeschritten','Mach einen Grab und streck dein hinteres Bein.']];
const $=id=>document.getElementById(id),colors=['#ff999e','#58d9dc','#91c9ff','#ffd665','#bba0ef','#a0e28a','#ffb77c','#83ddf0'];let level='Alle',done=new Set(),current=-1,rotation=0,busy=false,display=[];const filters=['Alle','Einfach','Mittel','Fortgeschritten'];function buildControls(){ $('levels').innerHTML=filters.map(x=>`<button data-level="${x}" class="${x===level?'active':''}">${x}</button>`).join('');$('filters').innerHTML=filters.map((x,i)=>`<button data-level="${x}" class="filter ${x===level?'active':''}"><span class="dot" style="background:${['#087be0','#2ab65c','#ffa83e','#ec5272'][i]}"></span><span>${x==='Alle'?'Alle Grabs':x}<small>${x==='Alle'?grabs.length:grabs.filter(g=>g[1]===x).length} Grabs</small></span></button>`).join('');document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{if(busy)return;level=b.dataset.level;current=-1;$('done').hidden=true;buildControls();drawWheel();showDefault();update()})}
function available(){return grabs.map((g,i)=>i).filter(i=>!done.has(i)&&(level==='Alle'||grabs[i][1]===level))}function drawWheel(){display=available();if(!display.length)display=grabs.map((g,i)=>i).filter(i=>level==='Alle'||grabs[i][1]===level);const n=display.length,step=360/n,rad=Math.PI/180;let svg='';display.forEach((id,i)=>{let a=(-90+i*step)*rad,b=(-90+(i+1)*step)*rad;let x1=300+294*Math.cos(a),y1=300+294*Math.sin(a),x2=300+294*Math.cos(b),y2=300+294*Math.sin(b);svg+=`<path d="M300 300 L${x1} ${y1} A294 294 0 ${step>180?1:0} 1 ${x2} ${y2} Z" fill="${colors[i%colors.length]}" stroke="white" stroke-width="3"/>`;let mid=(-90+(i+.5)*step)*rad,tx=300+210*Math.cos(mid),ty=300+210*Math.sin(mid),name=grabs[id][0].toUpperCase();svg+=`<text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="middle" font-size="${n>16?12:n>10?16:21}" font-weight="900" fill="#092a50" transform="rotate(${(-90+(i+.5)*step)+90},${tx},${ty})">${name.replaceAll('&','&amp;')}</text>`});$('wheel-svg').innerHTML=svg}function update(){$('progress').textContent=`${done.size} von ${grabs.length} geschafft`;$('spin').disabled=busy||available().length===0;if(!available().length)showDefault()}function showDefault(){$('result').innerHTML=available().length?'<h2>READY TO GRAB?</h2><p>Dreh am Rad und entdecke deine nächste Challenge!</p>':'<h2>🎉 ALLES GESCHAFFT!</h2><p>Wähle ein anderes Level oder starte neu.</p>'}
$('spin').onclick=()=>{let pool=available();if(busy||!pool.length)return;busy=true;current=pool[Math.floor(Math.random()*pool.length)];let idx=display.indexOf(current),step=360/display.length,desired=(360-((idx+.5)*step%360))%360,old=((rotation%360)+360)%360,delta=(desired-old+360)%360;rotation+=1800+delta;$('rotor').style.transform=`rotate(${rotation}deg)`;$('spin').disabled=true;$('done').hidden=true;$('result').innerHTML='<h2>🎲 DAS RAD DREHT SICH ...</h2><p>Welcher Grab kommt als Nächstes?</p>';setTimeout(()=>{let g=grabs[current];$('result').innerHTML=`<h2>${g[0].toUpperCase()}</h2><span class="tag">${g[1]}</span><p>${g[2]}</p>`;$('done').hidden=false;busy=false;update()},4300)};$('done').onclick=()=>{if(current>=0)done.add(current);current=-1;$('done').hidden=true;$('rotor').style.transition='none';rotation=0;$('rotor').style.transform='rotate(0deg)';void $('rotor').offsetWidth;$('rotor').style.transition='';drawWheel();$('result').innerHTML='<h2>🙌 STARK GEMACHT!</h2><p>Bereit für den nächsten Grab?</p>';update()};$('reset').onclick=()=>{if(busy)return;done.clear();current=-1;$('done').hidden=true;$('rotor').style.transition='none';rotation=0;$('rotor').style.transform='rotate(0deg)';void $('rotor').offsetWidth;$('rotor').style.transition='';drawWheel();showDefault();update()};buildControls();drawWheel();update();
</script></body></html>
